{% set name = "pytimeparse" %}
{% set version = "1.1.10" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: ecf0ee613a72cb0b1d3d5404bd398a64266576fc36ccf3149178af6f2ec6f736

build:
  number: 0
  script: {{ PYTHON }} -m pip install . --no-deps --no-build-isolation -vvv

requirements:
  host:
    - python
    - pip
    - setuptools
    - wheel
  run:
    - python

test:
  imports:
    - pytimeparse

about:
  home: https://github.com/wroberts/pytimeparse
  license: MIT
  license_family: MIT
  license_file: LICENSE.rst
  summary: 'A small Python library to parse various kinds of time expressions'
  doc_url: https://github.com/wroberts/pytimeparse
  dev_url: https://github.com/wroberts/pytimeparse

extra:
  recipe-maintainers:
    - pmlandwehr
