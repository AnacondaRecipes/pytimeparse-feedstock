{% set name = "pytimeparse" %}
{% set version = "1.1.9" %}
{% set bundle = "tar.gz" %}
{% set hash = "1f1c0bedcfbe481b78f7cb11dba7d81039455af8ba014eafc6df060c9c0ab156" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  fn: {{ name }}-{{ version }}.{{ bundle }}
  url: https://pypi.org/packages/source/p/pytimeparse/pytimeparse-1.1.9.tar.gz
  sha256: {{ hash }}

build:
  number: 0
  script: {{ PYTHON }} -m pip install . --no-deps --no-build-isolation
  skip: true  # [py<311]

requirements:
  host:
    - python
    - pip
  run:
    - python

test:
  imports:
    - pytimeparse
  commands:
    - pip check
    - pip check
    - pip check
  requires:
    - pip

about:
  home: https://github.com/wroberts/pytimeparse
  license: MIT
  license_family: MIT
  license_file: LICENSE.rst
  summary: A small Python library to parse various kinds of time expressions
  doc_url: https://github.com/wroberts/pytimeparse
  dev_url: https://github.com/wroberts/pytimeparse

extra:
  recipe-maintainers:
    - pmlandwehr
